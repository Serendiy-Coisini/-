<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product != null} ? '编辑商品' : '新增商品'">编辑 - 校园零售销售系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; }
        .head { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 12px 24px; }
        .head a { color: #fff; text-decoration: none; }
        .main { max-width: 500px; margin: 24px auto; padding: 0 20px; }
        .form { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #333; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        textarea { min-height: 80px; resize: vertical; }
        .btn { padding: 10px 24px; background: #667eea; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px; }
        .btn:hover { background: #5568d3; }
        .btn-secondary { background: #95a5a6; }
        .img-preview { max-width: 200px; max-height: 200px; margin-top: 8px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="head"><a href="/product/manage">← 返回商品管理</a></div>
    <div class="main">
        <div class="form">
            <h2 th:text="${product != null} ? '编辑商品' : '新增商品'">编辑</h2>
            <form action="/product/save" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:if="${product != null}" th:value="${product.id}">
                <div class="form-group">
                    <label>商品名称 *</label>
                    <input type="text" name="name" th:value="${product?.name}" required>
                </div>
                <div class="form-group">
                    <label>单价 *</label>
                    <input type="number" name="price" step="0.01" th:value="${product?.price}" required>
                </div>
                <div class="form-group">
                    <label>库存 *</label>
                    <input type="number" name="stock" th:value="${product?.stock ?: 0}" required>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <input type="text" name="category" th:value="${product?.category}" placeholder="如：饮料、食品、日用品">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea name="description" th:text="${product?.description}"></textarea>
                </div>
                <div class="form-group">
                    <label>商品图片（添加或更换）</label>
                    <input type="file" name="image" accept="image/*">
                    <img th:if="${product?.imageUrl != null and !product.imageUrl.isEmpty()}" th:src="${product.imageUrl}" alt="当前图片" class="img-preview">
                </div>
                <button type="submit" class="btn">保存</button>
                <a href="/product/manage" class="btn btn-secondary">取消</a>
            </form>
        </div>
    </div>
</body>
</html>
