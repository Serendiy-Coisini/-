<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 校园零售销售系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; }
        .head { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 12px 24px; }
        .head a { color: #fff; text-decoration: none; margin-right: 16px; }
        .main { max-width: 700px; margin: 24px auto; padding: 0 20px; }
        .msg { color: #0a0; margin-bottom: 12px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h3 { margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 0; border-bottom: 1px solid #eee; text-align: left; }
        .total { font-weight: bold; font-size: 16px; margin-top: 12px; }
        .status { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .status-PENDING { background: #fff3cd; color: #856404; }
        .status-PAID { background: #d4edda; color: #155724; }
        .status-CANCELLED { background: #f8d7da; color: #721c24; }
        a.btn { display: inline-block; padding: 6px 14px; background: #667eea; color: #fff; border-radius: 6px; text-decoration: none; margin-right: 8px; margin-top: 12px; }
        a.btn:hover { background: #5568d3; }
    </style>
</head>
<body>
    <div class="head">
        <a href="/">首页</a>
        <a href="/product/list">商品选购</a>
        <a href="/cart">购物车</a>
        <a href="/order/my">我的订单</a>
        <a href="/logout">退出</a>
    </div>
    <div class="main">
        <p class="msg" th:if="${msg}" th:text="${msg}"></p>
        <div class="card">
            <h3>订单信息</h3>
            <p>订单号：<span th:text="${order.orderNo}">-</span></p>
            <p>状态：<span th:class="'status status-' + ${order.status}" th:text="${order.status == 'PENDING' ? '待支付' : (order.status == 'PAID' ? '已支付' : '已取消')}">-</span></p>
            <p>下单时间：<span th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}">-</span></p>
            <p>收货：<span th:text="${order.receiverName}">-</span>，<span th:text="${order.receiverDormitory}">-</span>，<span th:text="${order.receiverPhone}">-</span></p>
        </div>
        <div class="card">
            <h3>商品明细</h3>
            <table>
                <tr>
                    <th>商品</th>
                    <th>单价</th>
                    <th>数量</th>
                    <th>小计</th>
                </tr>
                <tr th:each="item : ${items}">
                    <td th:text="${item.productName}">-</td>
                    <td th:text="'¥' + ${item.price}">-</td>
                    <td th:text="${item.quantity}">-</td>
                    <td th:text="'¥' + ${item.amount}">-</td>
                </tr>
            </table>
            <p class="total">订单总金额：¥<span th:text="${order.totalAmount}">0</span></p>
        </div>
        <div th:if="${order.status == 'PENDING'}">
            <a th:href="${'/order/pay/' + order.id}" class="btn">去支付</a>
            <a th:href="${'/order/cancel/' + order.id}" class="btn" style="background:#e74c3c">取消订单</a>
        </div>
        <a href="/order/my" class="btn" style="background:#95a5a6">返回我的订单</a>
    </div>
</body>
</html>
