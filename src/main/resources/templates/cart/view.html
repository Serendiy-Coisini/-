<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 校园零售销售系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; }
        .head { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 12px 24px; }
        .head a { color: #fff; text-decoration: none; margin-right: 16px; }
        .main { max-width: 800px; margin: 24px auto; padding: 0 20px; }
        .msg { color: #0a0; margin-bottom: 12px; }
        .err { color: #c00; margin-bottom: 12px; }
        table { width: 100%; background: #fff; border-radius: 8px; border-collapse: collapse; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
        .cart-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
        .qty-input { width: 60px; padding: 4px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { padding: 4px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
        .btn-update { background: #667eea; color: #fff; }
        .btn-remove { background: #e74c3c; color: #fff; }
        .btn-checkout { padding: 12px 32px; background: #27ae60; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; }
        .btn-checkout:hover { background: #229954; }
        .total-bar { background: #fff; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: right; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .total-amount { font-size: 20px; font-weight: bold; color: #e74c3c; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="head">
        <a href="/">首页</a>
        <a href="/product/list">商品选购</a>
        <a href="/cart">购物车</a>
        <a href="/order/my">我的订单</a>
        <a href="/logout">退出</a>
    </div>
    <div class="main">
        <p class="msg" th:if="${msg}" th:text="${msg}"></p>
        <p class="err" th:if="${error}" th:text="${error}"></p>
        <table>
            <tr>
                <th>图片</th>
                <th>商品</th>
                <th>单价</th>
                <th>数量</th>
                <th>小计</th>
                <th>操作</th>
            </tr>
            <tr th:each="item : ${items}">
                <td>
                    <img th:src="${item.product.imageUrl != null and !item.product.imageUrl.isEmpty()} ? ${item.product.imageUrl} : '/img/placeholder.svg'" alt="" class="cart-img">
                </td>
                <td th:text="${item.product.name}">-</td>
                <td th:text="'¥' + ${item.product.price}">-</td>
                <td>
                    <form action="/cart/update" method="post" style="display:inline;">
                        <input type="hidden" name="productId" th:value="${item.product.id}">
                        <input type="number" name="quantity" class="qty-input" min="1" th:max="${item.product.stock}" th:value="${item.quantity}">
                        <button type="submit" class="btn btn-update">更新</button>
                    </form>
                </td>
                <td th:text="'¥' + ${item.subtotal}">-</td>
                <td><a th:href="${'/cart/remove/' + item.product.id}" class="btn btn-remove">删除</a></td>
            </tr>
        </table>
        <p th:if="${#lists.isEmpty(items)}" style="text-align:center;color:#888;padding:40px">购物车为空，<a href="/product/list">去选购</a></p>
        <div th:if="${!#lists.isEmpty(items)}" class="total-bar">
            <div class="total-amount">
                总计：¥<span th:text="${total}">0</span>
            </div>
            <a href="/order/confirm" class="btn-checkout">去结算</a>
            <a href="/product/list" style="margin-left:12px;color:#667eea;text-decoration:none;">继续选购</a>
        </div>
    </div>
</body>
</html>
