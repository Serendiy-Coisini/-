# ========== 校园零售销售系统 - 配置文件 ==========

# 服务器端口
server.port=8080

# ---------- 数据库配置 (MySQL 8.0) ----------
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 请根据你的MySQL实际配置修改：数据库名、用户名、密码
spring.datasource.url=jdbc:mysql://localhost:3306/campus_retail?useSSL=false&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# Druid 连接池（可选）
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20

# ---------- MyBatis-Plus 配置 ----------
# 实体类别名包路径
mybatis-plus.type-aliases-package=com.campus.retail.entity
# 打印SQL日志（开发时方便调试，生产可关闭）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 驼峰命名转换
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ---------- 文件上传 ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=60MB

# ---------- Thymeleaf 网页模板 ----------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8


